{% extends 'base.html' %}

{% block content %}

<h4>Delete Comment</h4>

<p>Are you sure you want to delete this comment?</p>

<blockquote>
    {{ comment.content }}
</blockquote>

<form method="POST">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">Delete Comment

    </button> 
    <a href="{% url 'post_detail' comment.post.slug %}" class="btn btn-secondary">Cancel

    </a>
</form>

{% endblock %}
